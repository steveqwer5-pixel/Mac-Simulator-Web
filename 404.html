<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        (function() {
            var path = window.location.pathname;

            // 1. 如果用户访问的是带 .html 的网址（如 /wiki.html 或 /index.html），强行把地址栏的 .html 抹掉
            if (path.endsWith('.html')) {
                var cleanPath = path.slice(0, -5);
                if (cleanPath.endsWith('/index')) {
                    cleanPath = cleanPath.slice(0, -6) || '/';
                }
                var newUrl = cleanPath + window.location.search + window.location.hash;
                window.history.replaceState(null, '', newUrl);
                
                // 重新加载对应的实体 html 内容
                fetch(path)
                    .then(res => res.text())
                    .then(html => { document.open(); document.write(html); document.close(); });
                return;
            }

            // 2. 如果用户访问的是无后缀网址（如 /wiki 或 /feedback），自动拉取对应的 .html 文件并无缝渲染
            var targetFile = (path === '/' || path === '') ? '/index.html' : path + '.html';

            fetch(targetFile + window.location.search)
                .then(function(response) {
                    if (response.ok) {
                        return response.text();
                    }
                    throw new Error('Page not found');
                })
                .then(function(html) {
                    document.open();
                    document.write(html);
                    document.close();
                })
                .catch(function() {
                    document.body.innerHTML = '<h1 style="color:#fff;text-align:center;margin-top:100px;font-family:sans-serif;">404 - Page Not Found</h1>';
                });
        })();
    </script>
</head>
<body style="background-color: #0b0f19;">
</body>
</html>
