<!DOCTYPE html>
<html lang="zh-CN">
<script>
  // 如果地址栏带有 .html，立刻用 replaceState 抹掉，不刷新页面
  if (location.pathname.endsWith('.html')) {
    var cleanPath = location.pathname.replace(/\.html$/, '');
    if (cleanPath.endsWith('/index')) cleanPath = cleanPath.replace(/\/index$/, '/');
    history.replaceState(null, '', cleanPath + location.search + location.hash);
  }
</script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>留言反馈 - Mac Simulator</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --accent-blue: #0071e3;
            --accent-cyan: #00f2fe;
            --accent-purple: #7928ca;
            --bg-black: #030308;
            --card-bg: rgba(20, 20, 35, 0.75);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-main: #f5f5f7;
            --text-sub: #a1a1a6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body, html {
            width: 100%; height: 100%; overflow-x: hidden;
            background-color: var(--bg-black);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
        }

        #bg-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0; pointer-events: none;
        }

        .top-nav {
            position: fixed; top: 20px; left: 24px; right: 24px; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
        }

        .nav-btn {
            background: rgba(20, 20, 35, 0.75); color: var(--text-main);
            border: 1px solid var(--card-border); padding: 8px 18px; border-radius: 20px;
            font-size: 0.88rem; cursor: pointer; backdrop-filter: blur(15px); text-decoration: none;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            border-color: var(--accent-cyan); box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        .btn-bind {
            background: rgba(20, 20, 35, 0.75); color: #fff;
            border: 1px solid var(--card-border); padding: 8px 18px; border-radius: 20px;
            font-size: 0.88rem; font-weight: 600; cursor: pointer; backdrop-filter: blur(15px);
            display: inline-flex; align-items: center; gap: 8px; transition: all 0.3s ease;
        }

        .btn-bind:hover {
            border-color: var(--accent-cyan); box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
            transform: translateY(-2px);
        }

        /* 已绑定个人卡片 */
        .user-profile {
            display: none; align-items: center; gap: 10px;
            background: rgba(20, 20, 35, 0.75); border: 1px solid var(--card-border);
            padding: 5px 12px 5px 6px; border-radius: 25px; backdrop-filter: blur(15px);
        }

        .user-profile img {
            width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--accent-cyan); object-fit: cover;
        }

        .user-profile span {
            font-size: 0.88rem; font-weight: 600; color: var(--text-main);
        }

        /* 退出按钮 */
        .btn-logout {
            background: transparent;
            color: #ff4d4f;
            border: 1px solid rgba(255, 77, 79, 0.3);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            cursor: pointer;
            margin-left: 6px;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            background: rgba(255, 77, 79, 0.15);
            border-color: #ff4d4f;
        }

        .container { max-width: 800px; margin: 0 auto; padding: 90px 24px 60px; position: relative; z-index: 5; }

        .header-box { text-align: center; margin-bottom: 30px; }
        .header-box h1 {
            font-size: 2.2rem; font-weight: 700; margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 40%, var(--accent-cyan) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header-box p { color: var(--text-sub); font-size: 0.98rem; }

        .comment-form {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 20px; padding: 24px; backdrop-filter: blur(20px); margin-bottom: 30px;
        }

        .comment-textarea {
            width: 100%; height: 100px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border); border-radius: 12px; padding: 14px;
            color: #fff; font-size: 0.95rem; resize: none; outline: none; margin-bottom: 14px;
            user-select: text;
        }

        .comment-textarea:focus { border-color: var(--accent-cyan); box-shadow: 0 0 10px rgba(0, 242, 254, 0.2); }

        .btn-submit {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #fff; border: none; padding: 10px 24px; border-radius: 20px;
            font-size: 0.9rem; font-weight: 600; cursor: pointer; float: right; transition: all 0.3s ease;
        }

        .btn-submit:hover { box-shadow: 0 0 15px rgba(0, 242, 254, 0.4); transform: translateY(-2px); }

        .clearfix::after { content: ""; clear: both; display: table; }

        .comments-list { display: flex; flex-direction: column; gap: 16px; }
        .comment-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 16px; padding: 20px; backdrop-filter: blur(20px); user-select: text;
        }

        .comment-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
        .comment-avatar { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--accent-cyan); }
        .comment-author { font-weight: 600; font-size: 0.95rem; color: var(--accent-cyan); }
        .comment-time { font-size: 0.78rem; color: var(--text-sub); }
        .comment-body { color: var(--text-main); font-size: 0.95rem; line-height: 1.6; word-break: break-word; }

        /* 删除按钮 */
        .btn-delete {
            background: transparent;
            color: #ff4d4f;
            border: none;
            font-size: 0.8rem;
            cursor: pointer;
            margin-left: auto;
            opacity: 0.75;
            transition: all 0.2s ease;
        }

        .btn-delete:hover {
            opacity: 1;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="top-nav">
        <a href="index.html" class="nav-btn">← 返回首页</a>

        <div id="authArea">
            <button class="btn-bind" id="btnBindGithub" onclick="loginWithGithub()">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
                </svg>
                绑定 GitHub 账号
            </button>

            <div class="user-profile" id="userProfile">
                <img src="" alt="Avatar" id="navAvatar">
                <span id="navUsername"></span>
                <button class="btn-logout" onclick="logout()">退出</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="header-box">
            <h1>💬 社区留言与反馈</h1>
            <p>绑定 GitHub 账号后发送留言并保存至 Supabase 数据库</p>
        </div>

        <div class="comment-form clearfix">
            <textarea id="commentText" class="comment-textarea" placeholder="写下你的意见或建议..."></textarea>
            <button class="btn-submit" onclick="postComment()">发布留言</button>
        </div>

        <div class="comments-list" id="commentsContainer">
            <p style="text-align: center; color: var(--text-sub);">正在加载留言列表...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pexsmwuqnwkvmmmodamt.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ac-ERarehijW_Kkox5rEYw_vmdgatve';
        
        // 📍 管理员特权 UID
        const ADMIN_UID = 'a36ece6a-25b8-4772-b404-4980a1958d5b';

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = null;

        // 1. 登录跳转
        async function loginWithGithub() {
            const { error } = await db.auth.signInWithOAuth({
                provider: 'github',
                options: {
                    redirectTo: 'https://msw.zapto.org/feedback.html'
                }
            });
            if (error) alert('登录跳转失败: ' + error.message);
        }

        // 2. 退出登录
        async function logout() {
            await db.auth.signOut();
            currentUser = null;

            document.getElementById('userProfile').style.display = 'none';
            document.getElementById('btnBindGithub').style.display = 'inline-flex';
            fetchComments();
        }

        // 3. 页面加载初始化
        window.addEventListener('DOMContentLoaded', async () => {
            await checkUserSession();
            fetchComments();
        });

        // 4. 获取当前用户 Session (包含 UID)
        async function checkUserSession() {
            const { data: { session } } = await db.auth.getSession();
            if (session && session.user) {
                const meta = session.user.user_metadata;
                currentUser = {
                    id: session.user.id, // 📍 记录 Supabase UID
                    username: meta.user_name || meta.preferred_username || 'GitHub用户',
                    avatarUrl: meta.avatar_url
                };

                document.getElementById('btnBindGithub').style.display = 'none';
                document.getElementById('navUsername').innerText = currentUser.username;
                document.getElementById('navAvatar').src = currentUser.avatarUrl;
                document.getElementById('userProfile').style.display = 'inline-flex';
            }
        }

        // 5. 拉取评论并根据 UID 判断删除权限
        async function fetchComments() {
            const { data, error } = await db.from('comments').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('commentsContainer');
            
            if (error || !data || data.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-sub);">暂无留言，快来抢沙发吧！</p>';
                return;
            }

            // 判断是否为管理员账号登录
            const isAdmin = currentUser && currentUser.id === ADMIN_UID;

            container.innerHTML = data.map(item => {
                // 条件：是大管理员 OR 是发布者本人
                const canDelete = isAdmin || (currentUser && currentUser.id === item.user_id);

                return `
                    <div class="comment-card">
                        <div class="comment-header">
                            <img src="${item.avatar_url}" class="comment-avatar">
                            <span class="comment-author">${item.username}</span>
                            <span class="comment-time">${new Date(item.created_at).toLocaleString()}</span>
                            ${canDelete ? `<button class="btn-delete" onclick="deleteComment(${item.id})">删除</button>` : ''}
                        </div>
                        <div class="comment-body">${escapeHtml(item.content)}</div>
                    </div>
                `;
            }).join('');
        }

        // 6. 发布评论 (附带用户 UID)
        async function postComment() {
            if (!currentUser) {
                alert('请先绑定 GitHub 账号后再发送留言！');
                return;
            }
            const textarea = document.getElementById('commentText');
            const content = textarea.value.trim();
            if (!content) return alert('请输入内容！');

            const { error } = await db.from('comments').insert([{
                user_id: currentUser.id, // 📍 写入发帖人 UID
                username: currentUser.username,
                avatar_url: currentUser.avatarUrl,
                content: content
            }]);

            if (error) {
                alert('提交失败: ' + error.message);
            } else {
                textarea.value = '';
                fetchComments();
            }
        }

        // 7. 执行删除
        async function deleteComment(id) {
            if (!confirm('确定要删除这条留言吗？')) return;

            const { error } = await db.from('comments').delete().eq('id', id);

            if (error) {
                alert('删除失败: ' + error.message);
            } else {
                fetchComments();
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
        }

        // 背景星空画布
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth, height = canvas.height = window.innerHeight;
        const stars = Array.from({length: 200}, () => ({ x: (Math.random()-0.5)*width*2, y: (Math.random()-0.5)*height*2, z: Math.random()*width, size: Math.random()*1.5 }));
        
        function drawStars() {
            ctx.fillStyle = '#030308'; ctx.fillRect(0, 0, width, height);
            stars.forEach(s => {
                s.z -= 0.8; if(s.z <= 0) s.z = width;
                let k = 250/s.z, px = s.x*k + width/2, py = s.y*k + height/2;
                if(px>=0 && px<=width && py>=0 && py<=height) {
                    ctx.fillStyle = `rgba(0, 242, 254, ${1 - s.z/width})`;
                    ctx.beginPath(); ctx.arc(px, py, (1-s.z/width)*2.2*s.size, 0, Math.PI*2); ctx.fill();
                }
            });
            requestAnimationFrame(drawStars);
        }
        drawStars();
    </script>
</body>
</html>
