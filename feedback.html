<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>留言反馈 - Mac Simulator</title>
    <style>
        :root {
            --accent-blue: #0071e3;
            --accent-cyan: #00f2fe;
            --accent-purple: #7928ca;
            --bg-black: #030308;
            --card-bg: rgba(20, 20, 35, 0.65);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-main: #f5f5f7;
            --text-sub: #a1a1a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: var(--bg-black);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .top-nav {
            position: fixed;
            top: 20px;
            left: 24px;
            z-index: 100;
        }

        .nav-btn {
            background: rgba(20, 20, 35, 0.75);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.88rem;
            cursor: pointer;
            backdrop-filter: blur(15px);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
            color: #fff;
            transform: translateX(-2px);
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 90px 24px 60px;
            position: relative;
            z-index: 5;
        }

        .header-box {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-box h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 40%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-box p {
            color: var(--text-sub);
            font-size: 0.98rem;
        }

        /* 账号绑定信息栏 */
        .auth-card {
            background: rgba(25, 25, 45, 0.8);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(20px);
        }

        .auth-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #1e1e30;
            border: 1px solid var(--accent-cyan);
            object-fit: cover;
        }

        .user-detail h4 {
            font-size: 1.05rem;
            color: var(--text-main);
        }

        .user-detail p {
            font-size: 0.82rem;
            color: var(--text-sub);
        }

        /* 绑定按钮 */
        .btn-bind {
            background: linear-gradient(135deg, #24292e, #404448);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 24px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-bind:hover {
            background: linear-gradient(135deg, #33383c, #555a60);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .comments-wrapper {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(20px);
            min-height: 350px;
        }

        footer {
            text-align: center;
            padding: 30px 0;
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-top: 40px;
        }

        footer a {
            color: var(--accent-cyan);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="top-nav">
        <a href="index.html" class="nav-btn">← 返回首页</a>
    </div>

    <div class="container">
        <div class="header-box">
            <h1>💬 社区留言与反馈</h1>
            <p>点击上方绑定 GitHub 账号，自动获取用户名、头像与留言精确时间</p>
        </div>

        <div class="auth-card">
            <div class="auth-info">
                <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="Avatar" class="avatar" id="userAvatar">
                <div class="user-detail">
                    <h4 id="userName">未绑定 GitHub 账号</h4>
                    <p id="userStatus">点击右侧按钮登录以获取真实用户名与发言时间展示</p>
                </div>
            </div>
            <button class="btn-bind" id="btnBindGithub" onclick="loginWithGithub()">
                <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
                    <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
                </svg>
                <span id="btnText">绑定 GitHub 账号</span>
            </button>
        </div>

        <div class="comments-wrapper" id="commentBox">
            <script src="https://giscus.app/client.js"
                    data-repo="steveqwer5-pixel/Mac-Simulator"
                    data-repo-id="R_kgDORpQ-Xg"
                    data-category="Announcements"
                    data-category-id="DIC_kwDORpQ-Xs4C1234"
                    data-mapping="pathname"
                    data-strict="0"
                    data-reactions-enabled="1"
                    data-emit-metadata="1"
                    data-input-position="top"
                    data-theme="transparent_dark"
                    data-lang="zh-CN"
                    crossorigin="anonymous"
                    async>
            </script>
        </div>

        <footer>
            <p>Designed & Developed by <strong>FireMew0K</strong> | Powered by GitHub OAuth & Discussions</p>
        </footer>
    </div>

    <script>
        // 你的 Client ID (请填入你在 GitHub 创建 OAuth App 时获取的 Client ID)
        const CLIENT_ID = "Ov23li1PI8t6KfDmNAUe"; 

        // 1. 点击绑定按钮，触发 GitHub OAuth 授权跳转
        function loginWithGithub() {
            const redirectUri = window.location.href.split('?')[0]; 
            const githubAuthUrl = `https://github.com/login/oauth/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(redirectUri)}&scope=read:user`;
            window.location.href = githubAuthUrl;
        }

        // 2. 星空粒子背景动画
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const stars = [];
        const starCount = 280;
        let speed = 0.8;

        for (let i = 0; i < starCount; i++) {
            stars.push({
                x: (Math.random() - 0.5) * width * 2,
                y: (Math.random() - 0.5) * height * 2,
                z: Math.random() * width,
                size: Math.random() * 1.5
            });
        }

        function drawStars() {
            ctx.fillStyle = '#030308';
            ctx.fillRect(0, 0, width, height);

            const cx = width / 2;
            const cy = height / 2;

            for (let i = 0; i < starCount; i++) {
                let star = stars[i];
                star.z -= speed;

                if (star.z <= 0) {
                    star.z = width;
                    star.x = (Math.random() - 0.5) * width * 2;
                    star.y = (Math.random() - 0.5) * height * 2;
                }

                let k = 250 / star.z;
                let px = star.x * k + cx;
                let py = star.y * k + cy;

                if (px >= 0 && px <= width && py >= 0 && py <= height) {
                    let size = (1 - star.z / width) * 2.2 * star.size;
                    let alpha = (1 - star.z / width);
                    ctx.fillStyle = `rgba(0, 242, 254, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(px, py, size > 0 ? size : 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            requestAnimationFrame(drawStars);
        }
        drawStars();

        // 3. 监听登录组件消息，登录后自动提取用户名和头像展示在顶栏
        window.addEventListener('message', (event) => {
            if (event.origin !== 'https://giscus.app') return;
            if (!(typeof event.data === 'object' && event.data.giscus)) return;

            const giscusData = event.data.giscus;
            if (giscusData.viewer) {
                const user = giscusData.viewer;
                document.getElementById('userName').innerText = `已绑定: ${user.login}`;
                document.getElementById('userAvatar').src = user.avatarUrl;
                document.getElementById('userStatus').innerText = '身份验证成功，留言将自动附加你的头像、用户名与日期时间';
                document.getElementById('btnText').innerText = '✓ 已成功绑定';
                document.getElementById('btnBindGithub').style.background = '#0071e3';
            }
        });
    </script>
</body>
</html>
